<div class="site-shell" data-testid="pulsecraft-site">
  <!-- Ambient background lighting orbs -->
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="ambient ambient-three" aria-hidden="true"></div>

  <!-- Noise texture overlay -->
  <div class="noise" aria-hidden="true"></div>

  <!-- Sticky Navbar -->
  <app-navbar></app-navbar>

  <!-- Main Website Content -->
  <main id="main-content">
    <!-- Hero Section -->
    <app-hero></app-hero>

    <!-- Apps & Games Showcase -->
    <app-apps-showcase (appSelected)="openApp($event)"></app-apps-showcase>

    <!-- About the Studio -->
    <app-about></app-about>

    <!-- Vision & Future Projects -->
    <app-vision></app-vision>

    <!-- Contact Section -->
    <app-contact></app-contact>
  </main>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- App Details Modal Dialog -->
  @if (selectedApp()) {
    <app-modal [app]="selectedApp()" (closeModal)="closeApp()"></app-modal>
  }
</div>
