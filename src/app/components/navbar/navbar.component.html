<header class="site-nav" [class.is-scrolled]="scrolled()" data-testid="site-navigation">
  <div class="container nav-inner">
    <!-- Brand Logo -->
    <a
      class="brand"
      href="#home"
      (click)="scrollTo('home', $event)"
      aria-label="PulseCraft Studio home"
      data-testid="nav-brand-link"
    >
      <span class="brand-mark" aria-hidden="true">
        <i></i>
        <i></i>
        <i></i>
      </span>
      <span class="brand-text">
        <strong>PulseCraft</strong>
        <em>Studio</em>
      </span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links" [class.menu-open]="menuOpen()" aria-label="Main navigation" data-testid="main-navigation">
      <a
        href="#home"
        [class.active]="activeSection() === 'home'"
        (click)="scrollTo('home', $event)"
        data-testid="nav-home-link"
      >
        Home
      </a>
      <a
        href="#apps"
        [class.active]="activeSection() === 'apps'"
        (click)="scrollTo('apps', $event)"
        data-testid="nav-apps-link"
      >
        Our Apps
      </a>
      <a
        href="#about"
        [class.active]="activeSection() === 'about'"
        (click)="scrollTo('about', $event)"
        data-testid="nav-about-link"
      >
        About Us
      </a>
      <a
        href="#vision"
        [class.active]="activeSection() === 'vision'"
        (click)="scrollTo('vision', $event)"
        data-testid="nav-vision-link"
      >
        Our Vision
      </a>
      <a
        href="#contact"
        [class.active]="activeSection() === 'contact'"
        (click)="scrollTo('contact', $event)"
        data-testid="nav-contact-link"
      >
        Contact
      </a>

      <!-- CTA in nav -->
      <a
        href="#apps"
        class="nav-cta"
        (click)="scrollTo('apps', $event)"
        data-testid="nav-explore-apps-link"
      >
        <span>Explore Apps</span>
        <svg
          class="nav-cta-icon"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    </nav>

    <!-- Mobile Hamburger Toggle -->
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      data-testid="mobile-menu-toggle"
    >
      @if (menuOpen()) {
        <!-- X icon -->
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      } @else {
        <!-- Hamburger Menu icon -->
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      }
    </button>
  </div>
</header>
