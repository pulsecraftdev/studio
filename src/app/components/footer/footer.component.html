<footer class="site-footer" data-testid="site-footer">
  <!-- Top section -->
  <div class="container footer-top">
    <!-- Brand / Blurb -->
    <div class="footer-brand-wrap">
      <a
        class="brand brand-footer"
        href="#home"
        (click)="scrollTo('home', $event)"
        aria-label="PulseCraft Studio home"
        data-testid="footer-brand-link"
      >
        <span class="brand-mark" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </span>
        <span class="brand-text">
          <strong>PulseCraft</strong>
          <em>Studio</em>
        </span>
      </a>
      <p class="footer-blurb">
        Building creative mobile games and useful apps designed to make everyday experiences more engaging.
      </p>
    </div>

    <!-- Quick Navigation -->
    <div class="footer-nav">
      <p class="footer-nav-title">Explore</p>
      <a
        href="#apps"
        (click)="scrollTo('apps', $event)"
        data-testid="footer-apps-link"
      >
        Our apps &amp; games
      </a>
      <a
        href="#about"
        (click)="scrollTo('about', $event)"
        data-testid="footer-about-link"
      >
        About the studio
      </a>
      <a
        href="#vision"
        (click)="scrollTo('vision', $event)"
        data-testid="footer-vision-link"
      >
        Our vision
      </a>
      <a
        href="#contact"
        (click)="scrollTo('contact', $event)"
        data-testid="footer-contact-link"
      >
        Get in touch
      </a>
    </div>

    <!-- Connect Column -->
    <div class="footer-nav">
      <p class="footer-nav-title">Connect</p>
      <a
        [href]="'mailto:' + studio.email"
        data-testid="footer-email-link"
        aria-label="Email PulseCraft Studio"
      >
        <span>Email us</span>
      </a>
      <a
        [href]="studio.github"
        target="_blank"
        rel="noopener noreferrer"
        data-testid="footer-github-link"
        aria-label="PulseCraft Studio GitHub (opens in new tab)"
      >
        <span>GitHub</span>
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>
  </div>

  <!-- Bottom Row -->
  <div class="container footer-bottom">
    <span class="copyright">
      &copy; {{ currentYear }} PulseCraft Studio. All rights reserved.
    </span>

    <button
      type="button"
      class="back-top"
      (click)="scrollToTop()"
      data-testid="back-to-top-button"
      aria-label="Back to top of page"
    >
      <span>Back to top</span>
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </div>
</footer>
